name: نشر الموقع على GitHub Pages

on:
  push:
    branches:
      - arena/d1688041-cv
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: نشر مجلد site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: سحب المستودع
        uses: actions/checkout@v4

      - name: تهيئة Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: تجهيز ملفات الموقع
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: النشر
        id: deployment
        uses: actions/deploy-pages@v4
